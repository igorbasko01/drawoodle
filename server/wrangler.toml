# The game's Cloudflare Worker: serves the web app and the online server (/api/*)
# at https://drawoodle.baskorp.com.
# Deployed by .github/workflows/deploy.yml, which builds webapp/dist first.
name = "drawoodle"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# The game's own address. Cloudflare creates the DNS record and certificate.
routes = [{ pattern = "drawoodle.baskorp.com", custom_domain = true }]

# The built web app. Only /api/* runs the Worker; everything else is a static file.
[assets]
directory = "../webapp/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "drawoodle"
database_id = "3b6756b5-f1b9-48d1-ba9d-19a4b2ce8d3b"
migrations_dir = "migrations"

[observability]
enabled = true
